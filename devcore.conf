# Settings of the devcore gates. A plain shell file, read by the hooks and scripts; change a value here, never inside a script.

# Language of the messages the gates print: en or id.
DEVCORE_LANG=en

# The agent guide that the messages point to.
GUIDE=AGENTS.md

# The branch that CI compares a new branch with when it has no other starting point.
MAIN_BRANCH=v3.0.0-alpha

# A commit that touches a path matching this pattern (extended regular expression, matched against the path from the repository root)
# needs an approved brief or a "Brief: none: <reason>" line. List the folders and files that hold your code, tests, scripts, and settings.
CODE_PATHS='^(src|app|bootstrap|config|database|lang|public|resources|routes|scripts|tests|\.githooks|\.github)/|^(artisan|\.jscpd\.json|\.env\.example|\.npmrc|pnpm-workspace\.yaml|\.gitattributes|\.mcp\.json|devcore\.conf|package\.json|package-lock\.json|composer\.json|composer\.lock|phpunit\.xml|phpstan\.neon|pint\.json|vite\.config\.ts|tsconfig\.json|boost\.json)$'

# Paths whose changes the weakened-check gate reads (code, tests, and the settings of the checks), and the paths that are tests.
WEAKENED_SCAN='^(app|bootstrap|config|database|lang|resources|routes|scripts|tests|\.githooks)/|^devcore\.conf$|^(phpstan|vite\.config|tsconfig|pint)'
TEST_PATHS='^tests/|\.test\.(ts|tsx)$'
