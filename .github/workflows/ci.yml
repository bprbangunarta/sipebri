name: gate

on:
  push:
    branches:
      - v3.0.0-alpha
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest

    env:
      # Tests use in-memory SQLite (phpunit.xml); the migration in `composer setup` uses the same, so no database service is needed.
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      # Vitest runs Vite in server mode, and the Laravel plugin refuses that under CI (the CI variable): without this `npm run check` fails
      # here while it passes locally. Production assets are still built by `composer setup`.
      LARAVEL_BYPASS_ENV_CHECK: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the weakened-check and Brief checks read the commits that were sent, not only the last one.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Installs the dependencies and the hooks path, creates .env, and builds the assets: whatever `scripts/verify.steps` needs.
      - name: Setup the application
        run: composer setup

      - name: Install the hooks path
        run: git config core.hooksPath .githooks

      # The only gate is scripts/verify.sh: adding a check to scripts/verify.steps adds it here and in the pre-push hook.
      # The range comes from the event. When its start is no commit this clone has (a new branch, or a force-push that dropped the old
      # tip), verify.sh would fall back to "commits on no remote", which is empty here because the checked-out branch is itself the
      # remote one, so nothing would be read. The commits listed by the event are checked instead (GitHub lists at most 20).
      - name: Run the gate
        run: |
          start="${VERIFY_RANGE%%..*}"
          if ! git cat-file -e "${start}^{commit}" 2>/dev/null; then
            set -- $PUSHED_COMMITS
            count=$#
            [ "$count" -ge 1 ] || count=1
            if git rev-parse --verify --quiet "HEAD~${count}" >/dev/null; then
              VERIFY_RANGE="HEAD~${count}..HEAD"
            else
              VERIFY_RANGE=HEAD
            fi
            export VERIFY_RANGE
          fi
          scripts/verify.sh
        env:
          PUSHED_COMMITS: ${{ join(github.event.commits.*.id, ' ') }}
          VERIFY_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
